<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fffaf3; color: #333; }
    header { background: #b3261e; color: white; text-align: center; padding: 40px 20px; }
    header h1 { margin: 0; font-size: 2.2rem; }
    main { max-width: 600px; margin: 30px auto; padding: 0 20px; }
    .plato { background: white; border-radius: 10px; padding: 16px; margin-bottom: 14px; display: flex; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .precio { font-weight: bold; color: #b3261e; }
  </style>
</head>
<body>
  <header>
    <h1>Restaurante Demo</h1>
    <p>Comida casera en Lima</p>
  </header>
  <main>
    <h2>Nuestra carta</h2>
    <div class="plato"><span>Lomo saltado</span><span class="precio">S/ 22</span></div>
    <div class="plato"><span>Ají de gallina</span><span class="precio">S/ 18</span></div>
    <div class="plato"><span>Ceviche clásico</span><span class="precio">S/ 28</span></div>
  </main>
</body>
</html>
